# Pushing a tag like v0.2.0 builds the Windows app and publishes it as a GitHub release.
# The app's updater downloads penny-pincher.exe from the latest release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Check the tag matches the version in Cargo.toml
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} doesn't match Cargo.toml version $version"
          }

      - run: cargo test --release

      - run: cargo build --release

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          $version = "${{ github.ref_name }}".TrimStart("v")
          & $iscc "/DAppVersion=$version" installer\penny-pincher.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      # penny-pincher-setup.exe is for new installs; the in-app updater downloads penny-pincher.exe.
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            target/installer/penny-pincher-setup.exe
            target/release/penny-pincher.exe
          generate_release_notes: true
